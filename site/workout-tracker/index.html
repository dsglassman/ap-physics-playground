<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0c0f14">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Fitness Tracker</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div><div class="eyebrow">TRAINING · CARDIO · NUTRITION · WEIGHT</div><h1>Fitness Tracker</h1><div id="coverage" class="muted"></div></div>
    <div id="status" class="status">Loading…</div>
  </header>
  <nav class="tabs" aria-label="Tracker sections">
    <button class="active" data-tab="dashboard">Dashboard</button>
    <button data-tab="weight">Weight</button>
    <button data-tab="strength">Strength</button>
    <button data-tab="exercise">Exercises</button>
    <button data-tab="cardio">Cardio</button>
    <button data-tab="nutrition">Nutrition</button>
    <button data-tab="recipes">Recipes</button>
    <button data-tab="timeline">Timeline</button>
    <button data-tab="quality">Data</button>
  </nav>
  <main>
    <section id="dashboard" class="view active"></section>
    <section id="weight" class="view"></section>
    <section id="strength" class="view"></section>
    <section id="exercise" class="view"></section>
    <section id="cardio" class="view"></section>
    <section id="nutrition" class="view"></section>
    <section id="recipes" class="view"></section>
    <section id="timeline" class="view"></section>
    <section id="quality" class="view"></section>
  </main>
  <footer>Historical baseline migrated from the corrected master. Future entries use the structured event journal.</footer>
  <script src="data-pack-1.js"></script>
  <script src="data-pack-2.js"></script>
  <script src="data-pack-3.js"></script>
  <script src="data-pack-4.js"></script>
  <script src="data-pack-5.js"></script>
  <script src="data-pack-6.js"></script>
  <script src="data-pack-7.js"></script>
  <script src="data-pack-8.js"></script>
  <script src="data-pack-9.js"></script>
  <script src="data-pack-10.js"></script>
  <script src="data-pack-11.js"></script>
  <script src="data-pack-12.js"></script>
  <script src="data-pack-13.js"></script>
  <script src="app-core.js"></script>
  <script src="app-views-a.js"></script>
  <script src="app-views-b.js"></script>
  <script src="app-runtime.js"></script>
  <script src="live-data.js"></script>
  <script src="data-loader.js"></script>
</body>
</html>
